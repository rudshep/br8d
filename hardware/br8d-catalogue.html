<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>br8d adapter module catalogue</title>
<style>
body { font-family: system-ui, sans-serif; line-height: 1.4; margin: 1.5rem auto; max-width: 64rem; padding: 0 1rem; }
.muted { color: #666; }
details { border: 1px solid #ccc; border-radius: 4px; margin: .4rem 0; padding: .4rem .6rem; }
summary { cursor: pointer; display: flex; gap: .8rem; align-items: center; }
summary img, .noimg { width: 96px; height: 72px; object-fit: contain; flex: none; }
.noimg { background: #eee; color: #666; font-size: .75rem; display: flex; align-items: center; justify-content: center; }
dl { display: grid; grid-template-columns: max-content 1fr; gap: .2rem .8rem; margin: .6rem 0 .2rem; }
dt { font-weight: 600; }
dd { margin: 0; }
dd ul { margin: 0; padding-left: 1.2rem; }
pre { margin: 0; white-space: pre-wrap; }
</style>
</head>
<body>
<h1 id="title">br8d adapter module catalogue</h1>
<div id="app">Loading…</div>
<script>
const folderLink = folder => folder.replace(/^hardware\//, '') + '/';

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else n.setAttribute(k, v);
  }
  n.append(...kids.filter(k => k !== null && k !== undefined));
  return n;
}

function value(v, key) {
  if (v === null || v === undefined || v === '' || (Array.isArray(v) && !v.length)) return el('span', { class: 'muted', text: '—' });
  if (key === 'folder') return el('a', { href: folderLink(v), text: v });
  if (Array.isArray(v) && v.every(x => typeof x === 'string')) return el('ul', {}, ...v.map(x => el('li', { text: x })));
  if (typeof v === 'object') return el('pre', { text: JSON.stringify(v, null, 2) });
  return document.createTextNode(String(v));
}

function fields(obj, skip = []) {
  const dl = el('dl');
  for (const [k, v] of Object.entries(obj)) {
    if (skip.includes(k)) continue;
    dl.append(el('dt', { text: k }), el('dd', {}, value(v, k)));
  }
  return dl;
}

function moduleCard(m) {
  const link = folderLink(m.folder);
  const thumb = m.files && m.files.thumbnail
    ? el('img', { src: link + m.files.thumbnail, alt: m.id })
    : el('div', { class: 'noimg', text: 'no image' });
  const summary = el('summary', {},
    thumb,
    el('div', {},
      el('div', {}, el('a', { href: link, text: m.id })),
      el('div', { class: 'muted', text: `${m.size} · pairs ${m.pairs.join(' ') || '—'} · map ${m.map || '—'} · ${m.status}` }),
      el('div', { text: (m.notes && m.notes[0]) || '' })));
  return el('details', {}, summary, fields(m, ['id']));
}

function familyBlock(f) {
  const title = f.folder ? el('a', { href: folderLink(f.folder), text: f.name }) : f.name;
  return el('section', {},
    el('h4', {}, title, f.composite ? el('span', { class: 'muted', text: ' (composite)' }) : null),
    ...(f.notes || []).map(t => el('p', { text: t })),
    el('p', { class: 'muted', text: 'Spec' }),
    fields(f.spec),
    ...f.modules.map(moduleCard));
}

fetch('br8d-catalogue.json')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    document.getElementById('title').textContent = d.title;
    const app = document.getElementById('app');
    app.textContent = '';
    app.append(...(d.notes || []).map(t => el('p', { class: 'muted', text: t })));
    for (const c of d.containers) {
      app.append(el('h2', { text: c.name }), ...(c.notes || []).map(t => el('p', { text: t })));
      for (const a of c.applications) {
        app.append(el('h3', { text: a.name }), ...(a.notes || []).map(t => el('p', { text: t })), ...a.families.map(familyBlock));
      }
    }
  })
  .catch(e => {
    document.getElementById('app').textContent =
      `Could not load br8d-catalogue.json (${e}). Browsers block fetch from file://, so serve this folder, e.g. "python -m http.server" in hardware\\.`;
  });
</script>
</body>
</html>
